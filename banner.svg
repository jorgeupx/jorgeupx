<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Jorgeupx — Backend Engineer · Self-taught · Always building">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#8B0000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="55%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1744" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </linearGradient>

    <filter id="title-glow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feFlood flood-color="#FF1744" flood-opacity="0.7"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="#0d1117"/>
  <rect width="1200" height="280" fill="url(#bg-glow)"/>

  <g fill="#ffffff" opacity="0.55">
    <circle cx="60" cy="40" r="0.8"/>
    <circle cx="140" cy="70" r="0.6"/>
    <circle cx="200" cy="30" r="1"/>
    <circle cx="280" cy="55" r="0.7"/>
    <circle cx="350" cy="20" r="0.8"/>
    <circle cx="450" cy="40" r="0.6"/>
    <circle cx="540" cy="25" r="0.7"/>
    <circle cx="650" cy="35" r="0.9"/>
    <circle cx="740" cy="20" r="0.6"/>
    <circle cx="850" cy="45" r="0.8"/>
    <circle cx="950" cy="30" r="1"/>
    <circle cx="1050" cy="60" r="0.7"/>
    <circle cx="1130" cy="35" r="0.8"/>
    <circle cx="40" cy="130" r="0.7"/>
    <circle cx="170" cy="180" r="0.6"/>
    <circle cx="60" cy="240" r="0.8"/>
    <circle cx="180" cy="255" r="0.6"/>
    <circle cx="290" cy="225" r="0.9"/>
    <circle cx="400" cy="250" r="0.7"/>
    <circle cx="540" cy="260" r="0.6"/>
    <circle cx="700" cy="245" r="0.7"/>
    <circle cx="820" cy="258" r="0.6"/>
    <circle cx="940" cy="230" r="0.8"/>
    <circle cx="1050" cy="250" r="0.7"/>
    <circle cx="1140" cy="220" r="0.9"/>
    <circle cx="1040" cy="180" r="0.6"/>
    <circle cx="1170" cy="150" r="0.7"/>
  </g>

  <text x="600" y="170" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="130" font-weight="900"
        fill="url(#title-grad)"
        filter="url(#title-glow)">Jorgeupx</text>

  <rect x="450" y="200" width="300" height="2" fill="url(#line-grad)" opacity="0.85"/>

  <text x="600" y="230" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="19" font-weight="500"
        fill="#e6edf3"
        letter-spacing="2">Backend Engineer  ·  Self-taught  ·  Always building</text>
</svg>
